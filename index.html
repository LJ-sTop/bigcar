<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>線上模擬測驗</title>
<style>
:root{--bg:#0b0f14;--card:#121821;--muted:#a7b0bd;--text:#e7ecf2;--accent:#4ea3ff;--accent-weak:#1c3a5a;--danger:#ff6b6b;--ok:#22c55e;--border:#1b2533}
html,body{height:100%}
body{margin:0;background :var(--bg);color :var(--text);font-family :system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
.topbar{position :sticky;top:0;z-index:10;background :linear-gradient(180deg,rgba(18,24,33,.98),rgba(18,24,33,.92));border-bottom:1px solid var(--border);backdrop-filter: blur(6px);padding:12px 16px;display :flex;align-items :center;gap:12px;justify-content:space-between}
.brand{font-weight:700;letter-spacing:.5px}
.badge{font-size:12px;padding:4px 8px;border-radius:999px;background :var(--accent-weak);color :var(--accent)}
.container{max-width:920px;margin:24px auto;padding:0 16px}
.card{background :var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 16px;margin:10px 0;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.center{display :grid;place-items :center;min-height:60dvh}
button{background :var(--accent);color:#001b33;border:none;border-radius:12px;padding:12px 16px;font-weight:700;cursor :pointer}
button.ghost{background :transparent;border:1px solid var(--border);color :var(--muted)}
button :disabled{opacity:.6;cursor :not-allowed}
.title{font-size:20px;font-weight:800;margin:0 0 10px}
.muted{color :var(--muted)}
.grid{display :grid;gap:12px}
.choices{display :grid;gap:10px;margin-top:12px}
.choice{border:1px solid var(--border);border-radius:12px;padding:12px;display :flex;gap:10px;align-items :flex-start;cursor :pointer;background:#0e141c}
.choice input{margin-top:4px}
.row{display :flex;gap:10px;flex-wrap :wrap;align-items :center}
.sep{height:1px;background :var(--border);margin:12px 0}
.pill{background:#0f1b28;border:1px solid var(--border);padding:4px 8px;border-radius:999px;font-size:12px;color :var(--muted)}
.answer-key{white-space :pre-wrap;font-family :ui-monospace,Menlo,Consolas,monospace;background:#0e141c;border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:8px}
.footer{color :var(--muted);font-size:12px;text-align :center;margin:16px 0 32px}
.section-header{display :flex;align-items :center;justify-content:space-between;margin-top:10px;margin-bottom:6px}
.sec-title{font-size:16px;font-weight:800}
.qnum{font-weight:700;color :var(--muted)}
.warn{color :var(--danger)} .ok{color :var(--ok)}
.sticky-actions{position :sticky;bottom:0;z-index:5;background :linear-gradient(0deg,rgba(18,24,33,.98),rgba(18,24,33,.86));border-top:1px solid var(--border);padding:10px 16px;margin-top:12px;border-bottom-left-radius:16px;border-bottom-right-radius:16px}
.small{font-size:12px;color :var(--muted)}

.range-grid{display:grid;gap:10px;margin-top:12px}.range-row{display:grid;grid-template-columns:minmax(150px,1fr) 75px 24px 75px 24px;align-items:center;gap:8px}.range-row input{box-sizing:border-box;width:75px;padding:9px 8px;border-radius:8px;border:1px solid var(--border);background:#0e141c;color:var(--text);font-size:15px}.range-row b{font-size:14px}@media(max-width:600px){.range-row{grid-template-columns:1fr 65px 18px 65px 18px;gap:5px}.range-row input{width:65px;padding:8px 5px}}
</style>
</head>
<body>
<div class="topbar">
  <div class="row">
    <div class="brand">模擬測驗</div>
    <span class="badge">夜間模式</span>
  </div>
  <div class="row">
    <span class="pill" id="statusPill">尚未開始</span>
    <button id="startBtn">開始測驗</button>
    <button id="submitBtn" class="ghost" disabled>交卷</button>
  </div>
</div>
<div class="container">
  <div id="answerKeyWrap" class="card" style="display:none">
    <div class="title">正確答案代號</div>
    <div class="small">（依題庫分段，各段題號自 1 起算；僅交卷後顯示）</div>
    <div id="answerKey" class="answer-key"></div>
  </div>
  <div id="startView" class="center">
    <div class="card" style="max-width:640px">
      <div class="title">規則</div>
      <ul class="muted">
        <li>四個題庫各隨機 10 題，共 40 題</li>
        <li>每一庫題號自 <b>1</b> 開始</li>
        <li>不限時間，交卷後才會顯示成績與正確答案代號</li>
        <li>總分 100 分</li>
      </ul>
      <div class="sep"></div>
      <div class="title">各大題題目範圍</div>
      <div class="range-grid">
        <div class="range-row"><b>交通規則（選擇）</b><input id="trafficMcStart" type="number" min="1" value="1"><span>～</span><input id="trafficMcEnd" type="number" min="1" value="250"><span>題</span></div>
        <div class="range-row"><b>交通規則（是非）</b><input id="trafficTfStart" type="number" min="1" value="1"><span>～</span><input id="trafficTfEnd" type="number" min="1" value="250"><span>題</span></div>
        <div class="range-row"><b>機械常識（選擇）</b><input id="mechMcStart" type="number" min="1" value="1"><span>～</span><input id="mechMcEnd" type="number" min="1" value="100"><span>題</span></div>
        <div class="range-row"><b>機械常識（是非）</b><input id="mechTfStart" type="number" min="1" value="1"><span>～</span><input id="mechTfEnd" type="number" min="1" value="100"><span>題</span></div>
      </div>
      <div class="small">每一大題會從自己設定的範圍內隨機抽 10 題。</div>
      <div class="sep"></div>
      <div class="grid"><button id="beginBtn">開始測驗</button></div>
    </div>
  </div>
  <div id="examView" style="display:none">
    <div id="sections"></div>
    <div class="sticky-actions row" style="justify-content:space-between">
      <span class="muted">完成作答後按「交卷」</span>
      <button id="submitBtnBottom" class="ghost" disabled>交卷</button>
    </div>
  </div>
   <div id="resultView" style="display:none">
    <div class="card">
      <div class="title">測驗完成 🎉</div>
      <div id="scoreLine" class="row" style="gap:12px;margin:8px 0">
        <span>總分：</span><b id="scoreText" class="ok" style="font-size:20px">0</b>
      </div>
      <div id="detailLines" class="muted"></div>
      <div class="sep"></div>
      <div class="title" style="margin-top:8px">答題詳解（你的作答 vs 正確答案）</div>
      <div id="review" class="muted"></div>
      <div class="sep"></div>
      <div class="row"><button onclick="location.reload()">重新測驗</button></div>
    </div>
  </div>
  <div class="footer">本頁面可離線開啟，無需伺服器。</div>
</div>

<script>

其他標誌、標線禁止或指示下，圓形綠燈表示准許車輛直行或左、右轉。","ans":true},{"q":"汽車駕駛人將四歲以下之兒童單獨留置於車內，處新臺幣三千元罰鍰。","ans":false},{"q":"加速車道指設於匝道與主線車道之間，專供汽車由匝道駛入主線車道前加速之車道。","ans":true},{"q":"持軍用汽車駕駛執照駕駛非軍用之車輛，處六千元以上一萬二千元以下罰鍰。","ans":false},{"q":"禁制標線係用以表示道路上之行進、禁止、限制等特殊規定，告示駕駛人及行人嚴格遵守。","ans":true},{"q":"汽車駕駛人停車時，在禁止臨時停車處所停車者，處新臺幣六百元以上一千二百元以下罰鍰。","ans":true},{"q":"軍車駕駛人行車，行車速度，超過規定之最高時速，或低於規定之最低時速，軍（士）官申誡至記過一次，士兵禁足三日至五日，並吊銷駕照。","ans":false},{"q":"汽車裝載貨物超過所行駛橋樑規定之載重限制者，除責令或當場禁止通行，並處罰鍰新臺幣一萬元，並另依其超載程度採取分級加重處罰，且無處罰上限。","ans":true},{"q":"占用道路之廢棄車輛，由環保單位或委託民間移置保管，經公告一個月無人認領，可依廢棄物清除。","ans":true},{"q":"高速公路指出入口不完全控制，中央分隔雙向行駛，除起訖點外，並與其他道路立體相交，專供汽車行駛之公路。","ans":false},{"q":"大型車行駛高速公路，在正常天候狀況下，車速每小時九十公里，前後兩車間之行車安全距離最小四十五公尺。","ans":false},{"q":"汽車駕駛人，在六個月內違規記點達六點以上者，吊扣駕照一個月。","ans":false},{"q":"四車道以上道路，其設有劃分島劃分快慢車道，在慢車道上行駛之車輛不得左轉。","ans":true},{"q":"在多車道的圓環，應讓外側車道之車輛先行。","ans":false},{"q":"汽車駕駛人轉彎時，除禁止行人穿越路段外，行近攜帶白手杖或導盲犬之視能障礙時不暫停讓視覺功能障礙時者先行通過者，處新臺幣兩千四百元以上七千二百元以下罰鍰。","ans":true},{"q":"汽車駕駛人轉彎或變換車道時，行經交岔路口未達中心處，占用來車道搶先左轉彎，處新臺幣九百元以上一千八百元以下罰鍰。","ans":false},{"q":"汽車駕駛人駕駛執照業經吊銷、註銷仍駕駛小型車或機車，處新臺幣六千元以上二萬四千元以下罰鍰，並當場禁止其駕駛，且駕駛執照，均應扣繳。","ans":true},{"q":"軍車駕駛人，按鳴喇叭不依規定，或按鳴喇叭超過規定音量者，軍（士）官申誠一次，士兵禁足一日至二日。","ans":true},{"q":"軍車駕駛人，不依規定使用燈光者，軍（士）官申誠一次二次，士兵禁足一日至三日。","ans":false},{"q":"人行道：指在道路上以標線劃設，供行人穿越道路的地方。","ans":false},{"q":"行人穿越道是指在道路上以枕木紋或斑馬紋之標線標劃，行人穿越道路之地方。","ans":true},{"q":"軍車駕駛人，在道路上蛇行，或以其他危險方式駕車，記過一次至記大過一次。因而肇事者，並吊扣其駕駛執照。","ans":false},{"q":"肇事車輛機件及車上痕跡證據尚須檢驗、鑑定或查證者，得予暫時扣留處理，其扣留期間不得超過一個月。","ans":false},{"q":"汽車駕駛人行至有號誌之交岔路口，遇紅燈不依車道連貫暫停而逕行插入車道間，致交通擁塞，妨礙其他車輛通行，處新臺幣六百元以上一千二百元以下罰鍰。","ans":true},{"q":"交叉路口無警察指揮，又無燈光號誌，如兩路均為支線道或幹線道時，左方車應禮讓右方車先行。","ans":true},{"q":"裝設行車紀錄器之汽車，其紀錄卡應保存半年備查。","ans":false},{"q":"汽車駕駛人受吊扣、吊銷駕駛執照處分尚未確定執行前，不得參加汽車駕駛執照之晉級考驗，如參加考驗取得高一級之駕駛執照資格者，該項資格於受執行吊扣或吊銷駕駛執照之處分時，一併吊扣或吊銷但持有機車駕駛執照報考小型汽車駕駛執照者，不在此限。","ans":true},{"q":"汽車號牌之型式、顏色及編號變更時，公路監理機關應通知汽車所有人限期換領新型號牌，逾期未換領又未申請延期者，其牌照不得使用，經再通知逾期仍不換領號牌，其牌照應予吊扣。","ans":false},{"q":"汽車由慢車道向右轉彎時應於距交岔路口三十至六十公尺處，換入慢車道。","ans":true},{"q":"標誌，是指管制道路交通，表示警告、禁制、指示，而在路面上繪製之線條或文字。","ans":false},{"q":"汽車號牌不得變造損毀、塗抹或黏貼其他材料，加裝飾物或霓虹燈、裝置旋轉架、顛倒懸掛或以安裝其他器具之方式使不能辨認其牌號，並不得以他物遮蔽，如有污穢，致不能辨認其牌號時，應清洗清楚。","ans":true},{"q":"裝載貨物長度，可以前伸超過車頭二公尺。","ans":false},{"q":"裝載危險物品（油料、彈藥）時，車上應具備乙支滅火器。","ans":false},{"q":"拼裝車輛，未經核准領用之牌照，應汽車所有人罰鍰並禁止其行駛，並且車輛並沒入。","ans":true},{"q":"斑馬紋行人穿越道線，設置於交岔路口。","ans":false},{"q":"超車時，應由前車左邊保持半公尺以上之間隔，加速超過，行至安全距離後，再行駛入原行路線。","ans":true},{"q":"煞車距離與車速成正比。","ans":false},{"q":"汽車行車執照或拖車使用證如遺失或損壞時，應由汽車駕駛人或拖車使用人申請補發或換發。","ans":false},{"q":"汽車號牌之一面或二面如遺失或損壞時，汽車所有人應向公路監理機關，重新申領牌照。但汽車號牌遺失者，應檢附公路監理機關車牌遺失證明單。","ans":false},{"q":"領有大貨車駕駛執照，駕駛大客車、聯結車、或領有大客車駕駛執照，駕駛聯結車者，汽車所有人及駕駛人各處罰鍰外，並禁止該汽車駕駛人繼續駕駛。","ans":true},{"q":"汽車按鳴喇叭，應以單響為原則。","ans":true},{"q":"交通標誌及標線，是表示警告、禁制、指示等功效。","ans":true},{"q":"汽車在未領有正式牌照前，駛往公路監理機關接受新領牌照前檢驗，應申領臨時牌照。","ans":true},{"q":"汽車買賣試車時，臨時牌照使用期限均不得超過七日。但有正常理由申請再領者，各以一次為限。","ans":false},{"q":"高速公路或快速道路與其他道路連接，以匝道構成立體相交之部分稱為輔助車道。","ans":false},{"q":"行車紀錄紙依規定保存一年，違者處新臺幣九千元以上一萬二千元以下罰鍰。","ans":true},{"q":"當三色燈紅燈亮起時右轉彎，處新臺幣一千八百元以上五千四百元以下罰鍰。","ans":false},{"q":"在山路行車交會時，靠山壁車輛，應讓道路外緣車優先通過。","ans":true},{"q":"停駛車輛復駛時應填具異動登記書向原登記停駛之公路監理機關申請認可並予登記後，發還牌照。","ans":true},{"q":"汽車報廢，應填具異動登記書，向公路警察機關辦理報廢登記，並同時將牌照繳還。","ans":false},{"q":"領有聯結車駕照者得駕駛大貨車及大客車。","ans":false},{"q":"所謂軸距，多軸者，以前軸或前軸組中心點與最後軸中心點間之距離。","ans":true},{"q":"小客車座位包括駕駛人在內為九座以下。","ans":true},{"q":"大貨車全長不得超過十二公尺。","ans":true},{"q":"汽車全寬不得超過二點五公尺，其後輪胎外緣與車身內緣之距離，大型車不得超過十五公分，小型車不得超過十公分。","ans":true},{"q":"載運危險物品之車輛，未經懸掛危險標誌者處新臺幣三千元以上六千元以下罰鍰。","ans":false},{"q":"自用小客車、自用小客貨兩用車或大型重型機車，出廠年份未滿五年者，免予定期檢驗；五年以上未滿十年者，每年至少檢驗一次；十年以上者每年至少檢驗二次。","ans":true},{"q":"車輛停放於高速公路服務區內超過8小時者，應予以舉發處罰。","ans":false},{"q":"汽車車身、引擎、底盤、電系或其他重要設備變更調換應申請實施定期檢驗。","ans":false},{"q":"檢驗不合格之汽車，責令於一個月內整修完善申請覆驗。","ans":true},{"q":"檢驗不合格部分如為傳動、制動或轉向系統者，應即扣留其牌照，由公路監理機關發給當日有效之進廠修理證，憑以駛赴修理。","ans":false},{"q":"將駕駛執照借供他人駕車者，吊扣其駕駛執照一個月。","ans":false},{"q":"持軍用駕駛執照，駕駛非軍用車輛者，准予免罰。","ans":false},{"q":"防衛駕駛行為三階段程序：看、想、做。","ans":true},{"q":"汽車行經高速公路載運物品散落於路肩或車道，應於物品後方50公尺至100公尺處，設置故障標誌，並即時清除。","ans":true},{"q":"未領有駕駛執照駕車者，與持有小型車駕駛執照駕駛聯結車、大客車、大貨車者，均處以罰鍰並禁止其駕駛。","ans":true},{"q":"駕駛人員患病、出國、服兵役、駕照被吊扣、羈押、服刑或受保安、感訓處分之執行，不能按時審驗者，得於病癒、回國、退役、駕照吊扣期滿、撤銷羈押、出獄或保安、感訓處分執行完畢一個月內持原照及有關證明向公路監理機關申請審驗。","ans":false},{"q":"3.5噸載重車搭乘式裝、徒手人員不得超過25員（含）。","ans":true},{"q":"汽車駕駛人，連續駕車超過八小時經查屬實，或患病足以影響安全駕駛者，處以一千二百元以上二千四百元以下罰鍰。","ans":true},{"q":"職業汽車駕駛人得憑因逾期審驗被註銷之職業駕駛執照，申請換發同等車類之普通駕駛執照。","ans":true},{"q":"學習大型車汽車駕駛，應向公路監理機關申領學習駕駛證。","ans":false},{"q":"危險物品運送人員，應經交通部許可之專業訓練機構訓練合格，並領有訓練證明書，始得駕駛裝載危險物品之汽車。","ans":true},{"q":"軍車特種車輛，除緊急特殊情況外，不能作行政使用。","ans":true},{"q":"軍車臨時停車未派人看管者處汽車駕駛長，禁足一至三日。","ans":true},{"q":"受吊扣駕駛執照之處分尚未期滿，不得參加汽車駕駛執照考驗。","ans":true},{"q":"速限40公里以下之道路，車輛故障時應於後方50-100公尺處放置故障標誌。","ans":false},{"q":"志願役士官持有大型車軍照滿一年者，於退伍時得換發職業大貨車駕照。","ans":false},{"q":"汽車因提供損壞保險或保險期間在六個月以上者，於復駛時應經檢驗合格後，始得將牌照發還。","ans":false},{"q":"申請汽車駕駛執照考驗，不依規定或利用不正當手段報名參加應考者，其考試資格應予取消，已考領駕駛執照者無效，由公路監理機關註銷並追繳之。","ans":true},{"q":"汽車臨時檢驗之基準，依定期檢驗之規定；機車臨時檢驗之基準，依申請牌照檢驗之規定。","ans":true},{"q":"路程達三十公里以上者，不得使用軍車作運輸。","ans":false},{"q":"汽機車駕照考驗代考者，取消報考人之考試資格，報考人及代考人如已領有駕駛執照者，由公路監理機關吊銷其駕駛執照，並吊銷之。","ans":false},{"q":"設有快慢車道分隔線之慢車道上，時速不得超過50公里。","ans":false},{"q":"交通道路設計主線車道與匝道之間，供汽車駛入主線前加速之車道。","ans":false},{"q":"汽車駕駛人得自願申請註銷駕駛執照或改領較低等級駕駛執照。但受吊扣駕駛執照處分者，於吊扣期滿後始得申請。","ans":true},{"q":"警告標誌設置位置與警告標的物起點之距離，應配合行車速率，自45公尺至200公尺為度，若受實際情形限制，得酌予變更。","ans":true},{"q":"減速車道指設於主線車道與匝道之間，供汽車駛離主線時減速之車道。","ans":true},{"q":"考領大型重型機車駕駛執照須年滿十八歲，最高年齡不受限制。","ans":false},{"q":"所謂高速公路，係指其出入口完全控制，並與其他道路立體相交，專供汽車行駛之公路。","ans":true},{"q":"原領有職業駕駛執照之駕駛人，取得高一級車類之普通駕駛執照資格滿一個月者得換領同級車類之職業駕駛執照。","ans":false},{"q":"汽車駕駛人自願註銷或改領較低等級駕駛執照後，有再駕駛原等級車輛需求者，應依規定重新考領取得原等級車類駕駛執照。","ans":true},{"q":"行駛高速公路及快速公路車輛、遊覽車全部不得使用翻修輪胎。","ans":true},{"q":"汽車駕駛人，駕駛汽車行經泥濘或積水路段不減速慢行，致污濕他人身體、衣物處新臺幣六百元以上一千八百元以下罰鍰。","ans":true},{"q":"鐵路平交道上無看守人員管理或無遮斷器、警鈴、閃光號誌之設備者駕駛人應在軌道外十公尺前暫停、看、聽鐵路兩端無火車來時，始得通過。","ans":false},{"q":"軍車保險為第三人意外責任險，是指凡因所有、使用或管理，發生意外事故，致第三人體傷死亡及財物損毀，依法由承保公司負責賠償。","ans":true},{"q":"臺灣本島以外軍車均納入保險。","ans":false},{"q":"汽車駕駛人，聞消防車、救護車、警備車、工程救險車、毒性化學物質災害事故應變車之警號，不立即避讓者，處汽車駕駛人新臺幣六百元以上一千八百元以下罰鍰，並吊銷駕駛執照。","ans":false},{"q":"軍車駕駛肇事視情節由地方交通法庭處理。","ans":false},{"q":"彎道等速行車產生離心力，其大小與轉彎半徑成正比。","ans":false},{"q":"標線用於管制交通，係表示警告、禁制、指示之標識，以線條、圖形、標字或其他導向裝置劃設於路面或其他設施上。","ans":true},{"q":"汽車駕駛人，連續駕車超過10小時，經查屬實，處新臺幣一千二百元以上二千四百元以下罰鍰，並禁止其駕駛。如應歸責於汽車所有人者，得吊扣其汽車牌照三個月。","ans":false},{"q":"汽車駕駛人超車時，未經前車表示允讓或讓路，即行超車，處新臺幣一千二百元以上三千六百元以下罰鍰。","ans":false},{"q":"軍車在營內停放，不按規定位置及不整齊者，或在營外行駛軍容不整潔及臨時停車未留人看守者，其駕駛軍（士）官申誠一次，士兵禁足一日至三日。","ans":true},{"q":"職業汽車駕駛執照，應自發照之日起，每滿兩年申請審驗一次。","ans":false},{"q":"汽車駕駛人，在道路上蛇行或以其他危險方式駕駛時，處新臺幣六千元以上三萬六千元以下罰鍰並當場禁止其駕駛。","ans":true},{"q":"裝載貨物高度自地面算起，大型車不得超過4公尺，小型車不得超過2.85公尺。","ans":true},{"q":"汽車駕駛人，駕駛汽車行駛速度，超過規定之最高時速80公里以上者，處新臺幣六千元以上三萬六千元以下罰鍰，並當場禁止其駕駛。","ans":false},{"q":"開車抬頭遠看簡單的解釋就是不要把眼光放太近，應該把主要注意力投放在按現行速度估算15秒所到達的地方，這15秒的時間即所謂目視前置時間。","ans":true},{"q":"軍用駕駛執照遺失未報備登記者，處主管申誠一次，士兵禁足一日至三日。","ans":true},{"q":"車速越快，反應時間越短。","ans":true},{"q":"汽車不依限期參加定期檢驗或臨時檢驗者，處汽車所有人新臺幣九百元以上一千八百元以下罰鍰；逾期3個月以上者並吊扣其牌照，檢驗合格後發還，逾期6個月以上者，註銷其牌照。","ans":false},{"q":"汽車駕駛人，駕駛執照逾有效期間仍駕車處新臺幣一千八百元以上三千六百元以下罰鍰，並禁止其駕駛。","ans":true},{"q":"剎車距離是駕駛人從眼睛看到危險狀況，經大腦反應後開始踩下剎車起，到車輛完全剎停住為止，車輛行進的距離謂之。","ans":false},{"q":"車速越快，所需煞車距離成反比。","ans":false},{"q":"表示地名、路線、方向及里程等之行車指示，用於一般行車指示標誌及行車指示性質告示牌之底色為藍色。","ans":false},{"q":"消防栓、消防車出入口10公尺內不得臨時停車。","ans":false},{"q":"四秒鐘法則，其中包括反應時間一秒、緩衝時間二秒、剎車時間一秒共四秒。","ans":true},{"q":"一般安全跟車距離是需考慮天候、速度。","ans":true},{"q":"汽車行車執照自發照日起算，期滿前後一個月須申請檢驗換照始得行駛。","ans":true},{"q":"小客車前座或貨車駕駛室乘人超過規定人數，處汽車駕駛人新臺幣三千元以上一萬八千元以下罰鍰，並責令改正或禁止通行。","ans":true},{"q":"汽車各項異動，不依規定申報登記者處新臺幣六百元以上一千八百元以下罰鍰。","ans":false},{"q":"對向行駛之左右轉車輛，以轉彎需進入同一車道時，右轉彎車輛應讓左轉彎車輛先行。","ans":true},{"q":"汽車駕駛人，駕車在鐵路平交道超車、迴車、倒車、臨時停車或停車者，處新臺幣六千元以上一萬二千元以下罰鍰。","ans":false},{"q":"高速公路、快速公路的內側車道應為超車道，超車後，如有安全距離未駛回原車道，致堵塞超車道行車者，處汽車駕駛人新臺幣六千元以上一萬二千元以下罰鍰。","ans":true},{"q":"汽車駕駛人停車時，停車時間、位置、方式、車種不依規定，處新臺幣六百元以上一千二百元以下罰鍰。","ans":true},{"q":"汽車號牌遺失不報請公路主管機關補發，經舉發後仍不辦理而行駛，處汽車所有人新臺幣三千六百元以上一萬零八百元以下罰鍰，並禁止其行駛。","ans":true},{"q":"在強風中行車，風速超過每秒10公尺，應暫停路邊，以防不測。","ans":true},{"q":"汽車裝設行車視野輔助系統、防止捲入裝置之規格及車輛種類，由公路監 ,"ans":false},{"q":"空氣濾清器阻塞時，會發生耗油、馬力不足等現象。","ans":true},{"q":"活塞環最上邊的一個，叫做油環，用以防止潤滑油進入活塞上部。","ans":false},{"q":"汽車加裝冷氣系統後，引擎散熱用之風扇，必須改裝成重負荷風扇。","ans":true},{"q":"踩煞車時，有軟軟的感覺，是煞車來令片有磨損的現象。","ans":false},{"q":"油水分離器其主要用途為過濾燃料中雜質。","ans":false},{"q":"水箱缺水致使引擎過熱，應該即時旋開水箱蓋。","ans":false},{"q":"大貨車『慢車調整器』得作為定速功能使用。","ans":false},{"q":"引擎的循環是進氣、壓縮、動力、前進。","ans":false},{"q":"空氣濾清芯子過髒時得用高壓噴槍做清潔。","ans":true},{"q":"煞車踏板已放鬆，煞車仍然咬住，可能為煞車踏板沒有空檔間隙。","ans":true},{"q":"活塞環的氣環（壓縮環）是用於防止氣缸內漏氣的。","ans":true},{"q":"柴油引擎若不能發動，而證實是缺油時，應該拆開柴油幫浦檢查。","ans":false},{"q":"離合器踏板回拉彈簧太弱會使離合器打滑。","ans":true},{"q":"引擎發動以後有力矩時，才能使引擎與傳動部份慢慢接合。","ans":true},{"q":"校正輪胎氣壓與決定前輪直前時，方向盤之位置，為車輪定位之兩重要因素。","ans":true},{"q":"電水不足時，應加注蒸餾水，電水應高出極板 3/8 吋。","ans":true},{"q":"空氣濾清器芯子用途為過濾進氣系統中空氣雜質。","ans":true},{"q":"大貨車發生爆胎時，應立即煞車，並打開故障燈，靠邊停車。","ans":false}];
</script>
<script>
const $ = (s,root=document)=>root.querySelector(s);
const $$ = (s,root=document)=>[...root.querySelectorAll(s)];
const shuffle = arr => arr.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const pickN = (arr,n,start,end)=> {
  // 保留原題庫題號，方便作答時顯示「第 X 題（原題庫第 Y 題）」
  const range = arr.slice(start - 1, end).map((item, index) => ({
    ...item,
    originalIndex: start + index
  }));
  return shuffle(range).slice(0, Math.min(n, range.length));
};

const BANKS = [
  { key:"traffic_mc", title:"交通規則（選擇）", type:"mc", data: TRAFFIC_MC },
  { key:"traffic_tf", title:"交通規則（是非）",  type:"tf", data: TRAFFIC_TF },
  { key:"mech_mc",    title:"機械常識（選擇）", type:"mc", data: MECHANICAL_MC },
  { key:"mech_tf",    title:"機械常識（是非）",  type:"tf", data: MECHANICAL_TF },
];

let examPapers = [];
let submitted = false;

const startBtn=$("#startBtn"), beginBtn=$("#beginBtn"),
      submitBtn=$("#submitBtn"), submitBtnBottom=$("#submitBtnBottom"),
      startView=$("#startView"), examView=$("#examView"), resultView=$("#resultView"),
      sectionsEl=$("#sections"), statusPill=$("#statusPill"),
      akWrap=$("#answerKeyWrap"), akBox=$("#answerKey"),
      scoreText=$("#scoreText"), detailLines=$("#detailLines"),
      review=$("#review");

startBtn.addEventListener("click", onStart);
beginBtn.addEventListener("click", onStart);
submitBtn.addEventListener("click", onSubmit);
submitBtnBottom.addEventListener("click", onSubmit);

function onStart(){
  const ok = BANKS.every(b => Array.isArray(b.data) && b.data.length>0);
  if(!ok){ alert("內建題庫為空或格式錯誤。"); return; }

  const ranges = [
    [Number($("#trafficMcStart").value), Number($("#trafficMcEnd").value)],
    [Number($("#trafficTfStart").value), Number($("#trafficTfEnd").value)],
    [Number($("#mechMcStart").value), Number($("#mechMcEnd").value)],
    [Number($("#mechTfStart").value), Number($("#mechTfEnd").value)]
  ];

  for(let i=0;i<ranges.length;i++){
    const [start,end] = ranges[i];
    const bank = BANKS[i];
    if(!Number.isInteger(start) || !Number.isInteger(end) || start < 1 || end < start){
      alert(`${bank.title}：題目範圍設定錯誤，請確認起始題號與結束題號。`);
      return;
    }
    if(end > bank.data.length){
      alert(`${bank.title}：題庫只有 ${bank.data.length} 題，無法設定到第 ${end} 題。`);
      return;
    }
    if(end - start + 1 < 10){
      alert(`${bank.title}：你設定的範圍只有 ${end - start + 1} 題，至少需要 10 題才能抽出 10 題。`);
      return;
    }
  }

  examPapers = BANKS.map((bank,i)=>{
    const [start,end] = ranges[i];
    const items = pickN(bank.data, 10, start, end);
    const answers = items.map(()=>null);
    return { title: bank.title, type: bank.type, items, answers, rangeStart:start, rangeEnd:end };
  });
  renderExam();
  startView.style.display="none";
  examView.style.display="";
  statusPill.textContent="作答中";
  submitBtn.disabled = true;
  submitBtnBottom.disabled = true;
}

function renderExam(){
  sectionsEl.innerHTML="";
  examPapers.forEach((paper, sIdx)=>{
    const sec = document.createElement("section");
    sec.className="card";
    const header = document.createElement("div");
    header.className="section-header";
    header.innerHTML = `<div class="sec-title">${paper.title}</div><div class="pill">第 ${paper.rangeStart}～${paper.rangeEnd} 題｜隨機 10 題</div>`;
    sec.appendChild(header);

    paper.items.forEach((it,i)=>{
      const block = document.createElement("div");
      block.className="q card";
      block.style.margin="10px 0";
      block.style.padding="14px";
      block.innerHTML = `<div class="row" style="justify-content:space-between">
                           <div class="qnum">第 ${i+1} 題 <span class="small">（原題庫第 ${it.originalIndex} 題）</span></div>
                         </div>
                         <div class="title" style="font-size:16px;margin-top:6px">${escapeHtml(it.q)}</div>`;
      const choices = document.createElement("div");
      choices.className="choices";

      if(paper.type==="mc"){
        it.options.forEach((opt,k)=>{
          const id=`s${sIdx}q${i}o${k}`;
          const label = (it.labels && it.labels[k]) ? it.labels[k] : idxToLetter(k);
          const wrap = document.createElement("label");
          wrap.className="choice";
          wrap.setAttribute("for",id);
          wrap.innerHTML = `<input type="radio" name="s${sIdx}q${i}" id="${id}" />
                            <div><b>${label}</b>．${escapeHtml(opt)}</div>`;
          wrap.addEventListener("click", ()=>{ paper.answers[i]=k; updateSubmitEnabled(); });
          choices.appendChild(wrap);
        });
      } else {
        [["O",true],["X",false]].forEach(([label,val],k)=>{
          const id=`s${sIdx}q${i}t${k}`;
          const wrap = document.createElement("label");
          wrap.className="choice";
          wrap.setAttribute("for",id);
          wrap.innerHTML = `<input type="radio" name="s${sIdx}q${i}" id="${id}" />
                            <div><b>${label}</b></div>`;
          wrap.addEventListener("click", ()=>{ paper.answers[i]=val; updateSubmitEnabled(); });
          choices.appendChild(wrap);
        });
      }
      block.appendChild(choices);
      sec.appendChild(block);
    });

    sectionsEl.appendChild(sec);
  });
}

function updateSubmitEnabled(){
  const allAns = examPapers.every(p=> p.answers.every(a=>a!==null && a!==undefined));
  submitBtn.disabled = !allAns; submitBtnBottom.disabled = !allAns;
}

function onSubmit(){
  if(submitted) return;
  submitted = true;
  submitBtn.disabled = true;
  submitBtnBottom.disabled = true;
  statusPill.textContent = "已交卷";

  let correctCount=0;
  const perQ = 100/40;
  const keyLines = [];
  const reviewSections = [];

  examPapers.forEach((paper,sIdx)=>{
    const secKey = [];
    const secReview = [];
    paper.items.forEach((it,i)=>{
      const ua = paper.answers[i];
      const ok = isCorrect(paper.type, it, ua);
      if(ok) correctCount++;

      const codeFor = (idx)=>{
        if(paper.type==="mc"){
          return (it.labels && it.labels[idx]) ? it.labels[idx] : idxToLetter(idx);
        }else{
          return idx ? "O" : "X";
        }
      };
      const rightCode = (paper.type==="mc") ? codeFor(it.ans) : codeFor(it.ans ? 1 : 0);
      secKey.push(`${i+1}. ${rightCode}`);

      let yourCode;
      if(ua===null || ua===undefined) yourCode="未作答";
      else yourCode = (paper.type==="mc") ? codeFor(ua) : (ua ? "O" : "X");

      secReview.push(
        `<div class="card" style="margin:8px 0;padding:12px">
           <div class="row" style="justify-content:space-between">
             <div><b>${paper.title}</b>｜第 ${i+1} 題（原題庫第 ${it.originalIndex} 題）</div>
             <div>${ok ? '<span class="ok">✔ 正確</span>' : '<span class="warn">✘ 錯誤</span>'}</div>
           </div>
           <div style="margin-top:6px">${escapeHtml(it.q)}</div>
           <div class="small" style="margin-top:6px">
             你的答案：<b>${escapeHtml(String(yourCode))}</b>　｜　正確答案：<b>${escapeHtml(String(rightCode))}</b>
           </div>
         </div>`
      );
    });
    keyLines.push(`【${paper.title}】\n` + secKey.join("  ") + "\n");
    reviewSections.push(`<div class="title" style="margin-top:6px">${paper.title}</div>` + secReview.join(""));
  });

  const score = (correctCount * 2.5).toFixed(1);
  scoreText.textContent = `${score} 分`;
  scoreText.className = score>=60 ? "ok" : "warn";
  detailLines.innerHTML = examPapers.map(p=>`<div>・${p.title}：10 題</div>`).join("");

  $("#answerKeyWrap").style.display = "";
  $("#answerKey").textContent = keyLines.join("\n");
  $("#review").innerHTML = reviewSections.join("");

  examView.style.display="none";
  resultView.style.display="";
}

function isCorrect(type,it,ua){
  if(ua===null || ua===undefined) return false;
  return type==="mc" ? Number(ua)===Number(it.ans) : Boolean(ua)===Boolean(it.ans);
}

function idxToLetter(i){ return ["A","B","C","D","E","F","G"][i] ?? "?"; }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    "\"":"&quot;",
    "'":"&#39;"
  }[m]));
}
</script>
</body>
</html>
